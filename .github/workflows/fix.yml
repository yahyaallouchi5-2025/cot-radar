# Workflow usa-e-getta: FRED in manutenzione -> niente tentativi a raffica (poi va cancellato).
name: Correzione FRED
on: workflow_dispatch
permissions:
  contents: write
jobs:
  applica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          echo '' | base64 -d | xz -d > /tmp/p.diff
          git apply /tmp/p.diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "FRED in manutenzione: una sola prova, poi dati salvati e controllo orario"
          git push
