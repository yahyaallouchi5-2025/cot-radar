# Workflow usa-e-getta: schermo intero compatibile con iPhone (poi va cancellato).
name: Correzione iPhone
on: workflow_dispatch
permissions:
  contents: write
jobs:
  applica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          echo '' | base64 -d | xz -d > /tmp/p.diff
          git apply /tmp/p.diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Schermo intero del grafico funzionante anche su iPhone"
          git push
