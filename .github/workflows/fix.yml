# Workflow usa-e-getta: piccola correzione di testo nel pannello COT (poi va cancellato).
name: Correzione testo
on: workflow_dispatch
permissions:
  contents: write
jobs:
  applica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          echo '' | base64 -d | xz -d > /tmp/p.diff
          git apply /tmp/p.diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Layout piu' largo e correzione 'vendite concentrate'"
          git push
