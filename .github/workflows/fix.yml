# Workflow usa-e-getta: applica una piccola patch (incorporata qui sotto). Va cancellato dopo l'uso.
name: Correzione
on: workflow_dispatch
permissions:
  contents: write
jobs:
  applica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          echo "" | base64 -d | xz -d > /tmp/p.diff
          git apply /tmp/p.diff
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "v5.2.1: stagionalita anche per le coppie con il dollaro (EURUSD, USDJPY...)"
          git push
