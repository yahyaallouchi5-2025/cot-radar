# Come "Aggiornamento automatico" ma per patch COMPRESSE (.b64 = base64 di xz): file piu' piccoli da caricare.
name: Aggiornamento compresso
on:
  push:
    branches: [main]
    paths: ["aggiornamento/*.b64"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: aggiornamento
jobs:
  applica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica le patch compresse
        run: |
          set -e
          ls aggiornamento/*.b64 >/dev/null 2>&1 || { echo "nessuna patch"; exit 0; }
          for f in $(ls aggiornamento/*.b64 | sort -V); do
            tr -d '\n\r ' < "$f" | base64 -d | xz -d > /tmp/p.diff
            sha256sum /tmp/p.diff
            git apply --whitespace=nowarn /tmp/p.diff
            git rm -q "$f"
          done
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "aggiornamento automatico: $(git diff --cached --stat | tail -1)"
          git push
      - name: Ricostruisci il sito
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sito.yml --ref main
