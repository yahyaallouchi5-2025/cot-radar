# Workflow usa-e-getta: ricompone la patch da aggiornamento/parte1..7.b64,
# la applica al codice e cancella la cartella temporanea.
name: Applica aggiornamento
on: workflow_dispatch
permissions:
  contents: write
jobs:
  applica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ricomponi e applica la patch
        run: |
          set -e
          for i in 1 2 3 4 5 6 7; do cat aggiornamento/parte$i.b64; done | tr -d '\n\r ' | base64 -d | xz -d > /tmp/p.diff
          sha256sum /tmp/p.diff
          git apply --whitespace=nowarn /tmp/p.diff
          git rm -rq aggiornamento
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiornamento 4.2: grafici TradingView, registro errori, dashboard anti-crash"
          git push
