# ============================================================================
# sito.yml - aggiorna e pubblica la dashboard su GitHub Pages, in automatico.
#
# GitHub esegue questi passi su un suo computer (gratis per i repository pubblici)
# negli orari scritti sotto "schedule". Gli orari sono in UTC (Italia = UTC+1 d'inverno, UTC+2 d'estate).
# Per lanciarlo a mano: scheda "Actions" -> "Sito" -> "Run workflow".
# DEBUG: in "Actions" clicca un'esecuzione -> "build" per vedere ogni riga stampata dal programma.
# ============================================================================
name: Sito

on:
  schedule:
    - cron: "5 20 * * 5"    # venerdi', dopo l'uscita del COT (15:30 New York con ora legale USA)
    - cron: "5 21 * * 5"    # venerdi', settimane con ora solare USA
    - cron: "0 22 * * 4"    # giovedi', dopo il bilancio Fed
    - cron: "30 5 * * 1-5"  # ogni mattina feriale: mercati e tassi BCE
  workflow_dispatch:         # pulsante "Run workflow"

permissions:
  contents: read             # leggere il codice
  pages: write               # pubblicare su Pages
  id-token: write            # richiesto dalla pubblicazione su Pages

concurrency:                 # se un aggiornamento e' gia' in corso, il nuovo lo sostituisce
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:                       # valori passati al job "segnala" (scritti da main.py)
      esito: ${{ steps.crea.outputs.esito }}
      errori: ${{ steps.crea.outputs.errori }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Copia locale dei dati tra un'esecuzione e l'altra: se una fonte non risponde,
      # il programma usa l'ultima versione scaricata invece di lasciare un buco.
      - uses: actions/cache@v4
        with:
          path: dati
          key: dati-${{ github.run_id }}
          restore-keys: dati-

      - name: Test
        run: python -m unittest discover -s tests

      - name: Scarica i dati e crea la pagina
        id: crea
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # chiave gratuita FRED, salvata nei "Secrets" del repository
        run: python main.py --out public --debug

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build              # parte solo se "build" e' andato bene: altrimenti resta online la versione precedente
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Segnalazioni automatiche: se l'aggiornamento fallisce o i dati hanno ERRORI, apre (o aggiorna) una Issue
  # nel repository: GitHub ti manda una mail. Quando tutto torna regolare, la Issue si chiude da sola.
  segnala:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Apri o chiudi la segnalazione
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          ESITO: ${{ needs.build.outputs.esito }}
          ERRORI: ${{ needs.build.outputs.errori }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITOLO="COT Radar: problema nell'aggiornamento"
          N=$(gh issue list --state open --search "$TITOLO in:title" --json number -q '.[0].number')
          if [ "$BUILD" = "success" ] && [ "$DEPLOY" = "success" ] && [ "$ESITO" != "errori" ]; then
            echo "Tutto regolare (esito: $ESITO)"
            if [ -n "$N" ]; then gh issue close "$N" -c "Risolto: aggiornamento regolare. $LINK"; fi
          else
            TESTO="Esito: build=$BUILD, pubblicazione=$DEPLOY, dati=$ESITO (errori: ${ERRORI:-?}). Dettagli: $LINK"
            echo "$TESTO"
            if [ -n "$N" ]; then gh issue comment "$N" -b "$TESTO"; else gh issue create -t "$TITOLO" -b "$TESTO"; fi
          fi
