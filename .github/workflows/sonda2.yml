# sonda2.yml - TEMPORANEO: verifica i suffissi Yahoo dei mercati asiatici ed emiratini. Da cancellare.
name: Sonda mercati
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse
          T = """7203.T 285A.T 9984.T 0700.HK 0005.HK 9988.HK 600519.SS 688981.SS 601318.SS RELIANCE.NS M&M.NS BAJAJ-AUTO.NS
          ^N225 ^HSI 000016.SS ^NSEI FADGI.FGI DFMGI.AE ^ADI
          FAB.AD FAB.AE IHC.AD ALDAR.AD ADNOCGAS.AD EAND.AD TAQA.AD ADCB.AD ADNOCDRILL.AD BOROUGE.AD ADPORTS.AD
          EMAAR.AE EMAAR.DU EMIRATESNBD.AE DIB.AE DEWA.AE SALIK.AE AIRARABIA.AE EMAARDEV.AE DU.AE PARKIN.AE TECOM.AE 2222.SR""".split()
          for t in T:
              u = "https://query1.finance.yahoo.com/v8/finance/chart/%s?range=max&interval=1mo" % urllib.parse.quote(t)
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "cot-radar/azioni"}), timeout=20) as r:
                      res = json.load(r)["chart"]["result"][0]
                  ts = res.get("timestamp") or []
                  m = res["meta"]
                  print("OK", t, m.get("longName") or m.get("shortName"), m.get("currency"), time.strftime("%Y-%m", time.gmtime(ts[0])) if ts else "-", len(ts))
              except Exception as e:
                  print("NO", t, getattr(e, "code", type(e).__name__))
              time.sleep(0.4)
          PY
