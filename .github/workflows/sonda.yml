# sonda.yml - TEMPORANEO: verifica cosa risponde Yahoo da GitHub Actions (grafici, profilo/settore, limiti). Da cancellare.
name: Sonda Yahoo
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, time, urllib.request, http.cookiejar
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          UA = {"User-Agent": "cot-radar/azioni"}
          def get(u):
              t = time.time()
              try:
                  with op.open(urllib.request.Request(u, headers=UA), timeout=20) as r:
                      return r.status, r.read(), round(time.time() - t, 2)
              except Exception as e:
                  return getattr(e, "code", type(e).__name__), b"", round(time.time() - t, 2)
          for t in ["AAPL", "BRK-B", "ENEL.MI", "NDA-FI.HE", "ADYEN.AS", "SAP.DE"]:
              s, b, d = get(f"https://query1.finance.yahoo.com/v8/finance/chart/{t}?range=2y&interval=1d")
              m = json.loads(b)["chart"]["result"][0]["meta"] if s == 200 else {}
              print("chart", t, s, d, len(b), m.get("currency"), m.get("longName"), m.get("instrumentType"))
          s, b, d = get("https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=max&interval=1mo")
          print("mensile max", s, len(b))
          # profilo (settore) con cookie + crumb
          print("cookie", get("https://fc.yahoo.com")[0], len(cj))
          s, crumb, d = get("https://query1.finance.yahoo.com/v1/test/getcrumb")
          print("crumb", s, crumb[:20])
          for t in ["AAPL", "ENEL.MI", "SAP.DE"]:
              s, b, d = get(f"https://query2.finance.yahoo.com/v10/finance/quoteSummary/{t}?modules=assetProfile,price&crumb={crumb.decode()}")
              try:
                  r = json.loads(b)["quoteSummary"]["result"][0]
                  print("profilo", t, s, r["assetProfile"].get("sector"), r["assetProfile"].get("industry"), r["price"].get("longName"))
              except Exception as e:
                  print("profilo", t, s, type(e).__name__, b[:120])
          # quote in blocco (nome, settore non incluso) per 50 ticker
          s, b, d = get(f"https://query1.finance.yahoo.com/v7/finance/quote?symbols=AAPL,MSFT,ENEL.MI&crumb={crumb.decode()}")
          print("quote", s, b[:200])
          # raffica: 120 grafici di fila per vedere se scatta il limite
          ok = 0; t0 = time.time(); codici = {}
          for i in range(120):
              s, b, d = get("https://query1.finance.yahoo.com/v8/finance/chart/MSFT?range=5d&interval=1d&x=%d" % i)
              codici[s] = codici.get(s, 0) + 1
          print("raffica 120", codici, round(time.time() - t0, 1), "s")
          PY
