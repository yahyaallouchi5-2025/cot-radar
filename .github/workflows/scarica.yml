# scarica.yml - TEMPORANEO: scarica da Yahoo i prezzi degli ETF settoriali nel ramo "storico" (yahoo/). Da cancellare dopo l'uso.
name: Scarica settori
on: workflow_dispatch
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin storico && git worktree add -q -B storico storico origin/storico
          python - <<'PY'
          import time
          from cot_radar import portafogli as p
          for t in "XLK XLF XLV XLE XLI XLP XLY XLU XLB VNQ ^GSPC".split():
              pts = p.scarica_yahoo(t)
              print(t, len(pts or []), pts[0] if pts else None)
              if pts:
                  p._scrivi("storico", t, pts)
              time.sleep(1)
          PY
          cd storico && git add -A yahoo && git commit -qm "storico: prezzi settori" && git push -q origin storico
