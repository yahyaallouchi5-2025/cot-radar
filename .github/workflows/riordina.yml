# riordina.yml - USA UNA VOLTA SOLA: sposta i file caricati dal browser nelle cartelle giuste.
# Dopo l'esecuzione questo file si puo' cancellare.
name: Riordina cartelle (una tantum)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  riordina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sposta i file
        run: |
          mkdir -p cot_radar web tests
          for f in __init__ analisi calcoli calendario config cot demo fonti log mercato mutui pagina; do git mv "$f.py" cot_radar/; done
          git mv app.js index.html stile.css web/
          git mv test_calcoli.py tests/
          git mv download .gitignore
          git rm -q sito.yml test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Riordina i file nelle cartelle del progetto"
          git push
