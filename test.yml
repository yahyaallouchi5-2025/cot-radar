# test.yml - a ogni modifica caricata su GitHub (push) o proposta (pull request) lancia i test.
# Se qualcosa si rompe, accanto alla modifica compare una X rossa: clicca per vedere quale test e' fallito.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]   # la versione minima supportata e una recente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python main.py --demo --out demo   # la dashboard con dati finti deve crearsi senza errori
